<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:512px; height:512px; background:#0f172a; font-family:'Noto Serif CJK JP', serif; }
  .frame { position:absolute; inset:36px; border:14px solid #fde68a; border-radius:18px;
           display:flex; align-items:center; justify-content:center; background:#0f172a;
           box-shadow: inset 0 0 0 6px #0f172a, inset 0 0 0 12px rgba(253,230,138,.35); }
  .a { font-size:250px; font-weight:700; color:#fde68a; line-height:1; margin-top:-14px; }
</style></head>
<body><div class="frame"><div class="a">A</div></div></body></html>
