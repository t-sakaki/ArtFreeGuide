<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden;
         font-family: 'Noto Sans CJK JP', sans-serif; background: #020617; color: #f8fafc; }
  .card { position: relative; width: 1200px; height: 630px;
          background:
            radial-gradient(900px 520px at 50% -12%, rgba(253,230,138,.20), transparent 62%),
            radial-gradient(700px 420px at 82% 108%, rgba(45,212,191,.14), transparent 60%),
            linear-gradient(160deg, #0f172a 0%, #020617 72%);
          overflow: hidden; }
  /* museum spotlight cone */
  .cone { position: absolute; top: -180px; left: 50%; transform: translateX(-50%);
          width: 0; height: 0; border-left: 330px solid transparent; border-right: 330px solid transparent;
          border-top: 720px solid rgba(253,230,138,.07); filter: blur(26px); }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(253,230,138,.28); border-radius: 10px; }
  .frame::after { content: ''; position: absolute; inset: 9px; border: 1px solid rgba(253,230,138,.13); border-radius: 6px; }
  .content { position: relative; height: 100%; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
  .eyebrow { font-size: 21px; letter-spacing: .42em; color: #fde68a; opacity: .9; margin-bottom: 26px; }
  h1 { font-family: 'Noto Serif CJK JP', serif; font-size: 104px; font-weight: 700; letter-spacing: .01em;
       color: #fef3c7; text-shadow: 0 0 60px rgba(253,230,138,.35); }
  .rule { width: 190px; height: 2px; margin: 30px 0 26px;
          background: linear-gradient(90deg, transparent, #fde68a, transparent); }
  .sub { font-family: 'Noto Serif CJK JP', serif; font-size: 33px; line-height: 1.5; color: #e2e8f0; }
  .tags { margin-top: 34px; display: flex; gap: 14px; }
  .tag { font-size: 19px; padding: 9px 20px; border-radius: 999px;
         border: 1px solid rgba(253,230,138,.35); color: #fde68a; background: rgba(253,230,138,.06); }
  .url { position: absolute; left: 60px; bottom: 52px; font-size: 19px; color: #94a3b8; letter-spacing: .04em; }
  .mark { position: absolute; right: 58px; bottom: 46px; }
</style>
</head>
<body>
  <div class="card">
    <div class="cone"></div>
    <div class="frame"></div>

    <!-- minimal water-lilies motif, bottom left -->
    <svg width="470" height="230" viewBox="0 0 470 230" style="position:absolute;left:0;bottom:-46px;opacity:.95">
      <g fill="none" stroke="#2dd4bf" stroke-opacity=".45" stroke-width="2">
        <path d="M-10 150 C 90 128, 190 172, 300 146 S 470 132, 490 152"/>
        <path d="M-10 186 C 110 166, 210 206, 320 182 S 470 170, 490 188"/>
      </g>
      <g fill="#2dd4bf" fill-opacity=".16">
        <ellipse cx="96" cy="158" rx="34" ry="11"/>
        <ellipse cx="212" cy="192" rx="27" ry="9"/>
        <ellipse cx="330" cy="152" rx="30" ry="10"/>
      </g>
      <g fill="#fde68a" fill-opacity=".6">
        <circle cx="96" cy="152" r="6"/><circle cx="212" cy="186" r="5"/><circle cx="330" cy="146" r="5"/>
      </g>
    </svg>

    <!-- minimal starry-night swirl, top right -->
    <svg width="330" height="250" viewBox="0 0 330 250" style="position:absolute;right:8px;top:6px;opacity:.9">
      <g fill="none" stroke="#fde68a" stroke-opacity=".4" stroke-width="2">
        <path d="M232 96 m-52 0 a52 52 0 1 1 104 0 a38 38 0 1 1 -76 0 a24 24 0 1 1 48 0"/>
        <path d="M96 60 C 150 34, 214 44, 268 26"/>
      </g>
      <g fill="#fde68a" fill-opacity=".8">
        <circle cx="120" cy="72" r="3"/><circle cx="164" cy="42" r="2.4"/><circle cx="286" cy="150" r="2.6"/>
      </g>
    </svg>

    <div class="content">
      <div class="eyebrow">FREE AUDIO GUIDE</div>
      <h1>ArtFreeGuide</h1>
      <div class="rule"></div>
      <div class="sub">聴くほど賢くなる、無料の美術館AI音声ガイド</div>
      <div class="tags">
        <div class="tag">AI解説</div>
        <div class="tag">見どころ</div>
        <div class="tag">ベクトル推薦</div>
        <div class="tag">5言語</div>
      </div>
    </div>

    <div class="url">art-free-guide.taira-sakakibara.workers.dev</div>

    <!-- QR-like mark -->
    <svg class="mark" width="76" height="76" viewBox="0 0 76 76">
      <rect width="76" height="76" rx="10" fill="rgba(253,230,138,.08)" stroke="rgba(253,230,138,.35)"/>
      <g fill="#fde68a" fill-opacity=".85">
        <rect x="12" y="12" width="18" height="18" rx="3"/>
        <rect x="46" y="12" width="18" height="18" rx="3"/>
        <rect x="12" y="46" width="18" height="18" rx="3"/>
        <rect x="46" y="46" width="7" height="7"/><rect x="57" y="46" width="7" height="7"/>
        <rect x="46" y="57" width="7" height="7"/><rect x="57" y="57" width="7" height="7"/>
      </g>
      <g fill="#020617">
        <rect x="18" y="18" width="6" height="6"/><rect x="52" y="18" width="6" height="6"/>
        <rect x="18" y="52" width="6" height="6"/>
      </g>
    </svg>
  </div>
</body>
</html>
