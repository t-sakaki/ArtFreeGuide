<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 675px; overflow: hidden;
         font-family: 'Noto Sans CJK JP', sans-serif; color: #f8fafc; background: #020617; }
  .stage { position: relative; width: 1200px; height: 675px; display: flex; align-items: center;
           background:
             radial-gradient(760px 460px at 26% -10%, rgba(253,230,138,.18), transparent 62%),
             radial-gradient(620px 420px at 96% 110%, rgba(45,212,191,.13), transparent 60%),
             linear-gradient(155deg, #0f172a 0%, #020617 70%);
           overflow: hidden; }
  .cone { position: absolute; top: -240px; right: 130px;
          width: 0; height: 0; border-left: 260px solid transparent; border-right: 260px solid transparent;
          border-top: 900px solid rgba(253,230,138,.07); filter: blur(30px); }
  .copy { width: 660px; padding: 0 0 0 78px; position: relative; }
  .eyebrow { font-size: 17px; letter-spacing: .4em; color: #fde68a; opacity: .9; margin-bottom: 20px; }
  h1 { font-family: 'Noto Serif CJK JP', serif; font-size: 74px; color: #fef3c7; letter-spacing: .01em;
       text-shadow: 0 0 54px rgba(253,230,138,.3); }
  .lead { font-family: 'Noto Serif CJK JP', serif; font-size: 29px; line-height: 1.55; margin-top: 22px; color: #e2e8f0; }
  .lead span { color: #fde68a; }
  .badges { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; width: 560px; }
  .badge { font-size: 18px; padding: 10px 18px; border-radius: 999px;
           border: 1px solid rgba(253,230,138,.32); color: #fde68a; background: rgba(253,230,138,.06); }
  .url { margin-top: 36px; font-size: 18px; color: #94a3b8; letter-spacing: .03em; }

  .device { position: absolute; right: 96px; top: 50%; transform: translateY(-50%) rotate(-3deg);
            width: 320px; height: 660px; border-radius: 46px; padding: 11px;
            background: linear-gradient(160deg, #334155, #0b1220 60%);
            box-shadow: 0 44px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(253,230,138,.16),
                        0 0 90px rgba(253,230,138,.10); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #020617; }
  .screen img { width: 100%; display: block; }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
           width: 108px; height: 22px; border-radius: 999px; background: #020617; }
  .glow { position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
          width: 430px; height: 430px; border-radius: 50%;
          background: radial-gradient(circle, rgba(253,230,138,.13), transparent 66%); filter: blur(12px); }
</style>
</head>
<body>
  <div class="stage">
    <div class="cone"></div>
    <div class="glow"></div>

    <div class="copy">
      <div class="eyebrow">FREE AUDIO GUIDE</div>
      <h1>ArtFreeGuide</h1>
      <div class="lead">美術館の音声ガイドを、誰でも無料で。<br><span>聴くほど賢くなる</span>、AI学芸員付きのパーソナルガイド</div>
      <div class="badges">
        <div class="badge">🎨 AI音声ガイド</div>
        <div class="badge">🔍 ベクトル検索推薦</div>
        <div class="badge">🎵 プロシージャルBGM</div>
        <div class="badge">🌍 多言語対応</div>
      </div>
      <div class="url">art-free-guide.taira-sakakibara.workers.dev</div>
    </div>

    <div class="device">
      <div class="screen">
        <img src="screen.png" alt="">
        <div class="notch"></div>
      </div>
    </div>
  </div>
</body>
</html>
