<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <title>ArtFreeGuide</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    #frame {
      position: fixed;
      inset: 0;
      border: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading">読み込み中…</div>
  <iframe id="frame" src="https://art-free-guide-staging.taira-sakakibara.workers.dev" allow="camera; microphone" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"></iframe>
  <script>
    const frame = document.getElementById('frame');
    frame.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
